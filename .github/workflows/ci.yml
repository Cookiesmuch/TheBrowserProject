name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: sync, patch, build, smoke-test
    runs-on: [self-hosted, windows, chromium-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap (depot_tools + gclient sync)
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Apply overlay + patches
        shell: pwsh
        run: ./scripts/apply-patches.ps1

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Smoke test — chrome.exe launches and exits cleanly
        shell: pwsh
        run: |
          $chrome = "chromium/src/out/Release/chrome.exe"
          if (-not (Test-Path $chrome)) { throw "chrome.exe not found at $chrome" }
          & $chrome --headless --disable-gpu --dump-dom "about:blank" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "chrome.exe exited with code $LASTEXITCODE" }
          Write-Host "chrome.exe launched and exited cleanly"
