name: release

# Interim: publishes a rolling "latest" prerelease whenever code lands on main
# (i.e. after a PR merges), replacing the old per-push-to-any-branch beta.yml —
# that was doubling CI cost on every single push while iterating on a PR.
# This is a placeholder, not the real versioning system: see #13 for the actual
# plan (codenamed majors, in-browser changelogs, a real auto-update mechanism).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-publish:
    name: build + publish release
    runs-on: [self-hosted, windows, chromium-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # See ci.yml — clean=true would delete the cached chromium/ and
          # depot_tools/ checkouts this runner is meant to reuse.
          clean: false

      - name: Verify GitHub CLI is available
        shell: pwsh
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            throw "GitHub CLI (gh) not found on this runner. Install it during runner provisioning (see CONTRIBUTING.md) before this workflow can publish releases."
          }
          gh --version

      - name: Bootstrap (depot_tools + gclient sync)
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Apply overlay + patches
        shell: pwsh
        run: ./scripts/apply-patches.ps1

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content chromium.version -Raw).Trim()
          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $zipName = "TheBrowserProject-$version-$stamp.zip"
          Compress-Archive -Path "chromium/src/out/Release/*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Publish rolling release
        shell: pwsh
        run: |
          # --cleanup-tag also deletes the "latest" tag itself — otherwise the next
          # `gh release create` would reuse the stale tag (defaulting to whatever
          # commit it last pointed at) instead of this run's actual commit.
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest "$env:ZIP_NAME" `
            --target "$env:GITHUB_SHA" `
            --title "Latest (main)" `
            --notes "Automated build from main, commit $env:GITHUB_SHA." `
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
