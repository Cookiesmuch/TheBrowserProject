name: beta

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  build-and-publish:
    name: build + publish rolling prerelease
    runs-on: [self-hosted, windows, chromium-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # See ci.yml — clean=true would delete the cached chromium/ and
          # depot_tools/ checkouts this runner is meant to reuse.
          clean: false

      - name: Verify GitHub CLI is available
        shell: pwsh
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            throw "GitHub CLI (gh) not found on this runner. Install it during runner provisioning (see CONTRIBUTING.md) before this workflow can publish releases."
          }
          gh --version

      - name: Bootstrap (depot_tools + gclient sync)
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Apply overlay + patches
        shell: pwsh
        run: ./scripts/apply-patches.ps1

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content chromium.version -Raw).Trim()
          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $zipName = "TheBrowserProject-beta-$version-$stamp.zip"
          Compress-Archive -Path "chromium/src/out/Release/*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Publish rolling prerelease
        shell: pwsh
        run: |
          # --cleanup-tag also deletes the beta-latest tag itself — otherwise the next
          # `gh release create` would reuse the stale tag (defaulting to the default
          # branch) instead of pointing at this run's actual commit.
          gh release delete beta-latest --yes --cleanup-tag 2>$null
          gh release create beta-latest "$env:ZIP_NAME" `
            --target "$env:GITHUB_SHA" `
            --title "Beta (rolling)" `
            --notes "Automated build from branch $env:GITHUB_REF_NAME, commit $env:GITHUB_SHA." `
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
