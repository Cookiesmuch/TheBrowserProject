name: beta

on:
  push:
    branches-ignore: [main]

jobs:
  build-and-publish:
    name: build + publish rolling prerelease
    runs-on: [self-hosted, windows, chromium-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap (depot_tools + gclient sync)
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Apply overlay + patches
        shell: pwsh
        run: ./scripts/apply-patches.ps1

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content chromium.version -Raw).Trim()
          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $zipName = "TheBrowserProject-beta-$version-$stamp.zip"
          Compress-Archive -Path "chromium/src/out/Release/*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Publish rolling prerelease
        shell: pwsh
        run: |
          gh release delete beta-latest --yes 2>$null
          gh release create beta-latest "$env:ZIP_NAME" `
            --title "Beta (rolling)" `
            --notes "Automated build from branch $env:GITHUB_REF_NAME, commit $env:GITHUB_SHA." `
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
